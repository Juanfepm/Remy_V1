<!DOCTYPE html>
<html lang="es">
<head>
    {% include "comun/raiz.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | REMY 1.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='modulo_reservas/rm_codigos/normalize.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='modulo_reservas/rm_codigos/formato_rm_clientes.css') }}">
    <script src="{{ url_for('static', filename='modulo_reservas/rm_codigos/config.js') }}" defer></script>
    <script src="{{ url_for('static', filename='modulo_reservas/rm_codigos/api.js') }}" defer></script>
    <script src="{{ url_for('static', filename='modulo_reservas/rm_codigos/plantillas.js') }}" defer></script>
    <script src="{{ url_for('static', filename='modulo_reservas/rm_codigos/eventos.js') }}" defer></script>
</head>
<body id="cuerpo_eventos">

    <header id="cabezote_titulo" class="fondo-azul" data-titulo="Eventos"></header>

    <main id="contenido_eventos">

        <div class="seccion-hoy-titulo">
            <span class="punto-v"></span>
            Disponible hoy
        </div>

        
        <p id="aviso_hoy" class="aviso aviso-cargando">Consultando el evento de hoy...</p>
        <article id="evento_hoy" class="hoy-card oculto"></article>

        <div class="fila-seccion">
            <span class="rotulo-seccion">Próximos eventos</span>
            
            <button type="button" id="btn_ver_todos" class="enlace-seccion oculto">Ver todos &gt;</button>
        </div>

        
        <p id="aviso_proximos" class="aviso aviso-cargando">Consultando los próximos eventos...</p>
        <div id="lista_proximos" class="carrusel"></div>

    </main>

    
    <dialog id="modal_asistencia" class="modal_rm">

        <h2 class="letra-azul-dark" id="nombre_mini_evento"></h2>
        <p id="detalle_mini_evento" class="letra-gris-dark"></p>

        <form id="forma_asistencia">

            <label for="correo_asistencia">Correo institucional</label>
            <input type="email" id="correo_asistencia"
                   placeholder="ejemplo@soy.sena.edu.co"
                   pattern="[a-zA-Z0-9._%+\-]+@(soy\.)?sena\.edu\.co"
                   title="Usa tu correo institucional @sena.edu.co o @soy.sena.edu.co"
                   maxlength="72" required>

            <p id="aviso_asistencia" class="aviso oculto"></p>

            <div class="fila_botones_modal">
                <button type="button" id="btn_cerrar_asistencia" class="btn-capsula capsula-full fondo-gris letra-gris-dark">Cerrar</button>
                <button type="submit" id="btn_confirmar_asistencia" class="btn-capsula capsula-full fondo-verde letra-blanca">Confirmar asistencia</button>
            </div>

        </form>

    </dialog>

    <nav id="tabs_inferior" data-activo="eventos"></nav>

</body>
</html>
