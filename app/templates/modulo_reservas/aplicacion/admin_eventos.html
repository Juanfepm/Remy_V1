<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador / Eventos | REMY 1.0</title>
    <link rel="stylesheet" href="/static/modulo_reservas/rm_codigos/normalize.css">
    <link rel="stylesheet" href="/static/modulo_reservas/rm_codigos/formato_rm_interno.css">
    <script src="/static/modulo_reservas/rm_codigos/config.js" defer></script>
    <script src="/static/modulo_reservas/rm_codigos/api.js" defer></script>
    <script src="/static/modulo_reservas/rm_codigos/sesion.js" defer></script>
    <script src="/static/modulo_reservas/rm_codigos/panel.js" defer></script>
    <script src="/static/modulo_reservas/rm_codigos/admin_eventos.js" defer></script>
</head>
<body>

    <main id="gran_padre_contenedor">

        <header id="cabezote_sesion" data-activo="eventos"></header>

        <section id="contenido_sesion">

            <header id="cabezote_admin" class="fondo-azul">
                <a href="dashboard.html" class="btn_volver letra-blanca" aria-label="Volver">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </a>
                <h1 class="letra-blanca">Administrador / Eventos</h1>
                <span class="hueco_cabezote"></span>
            </header>

            <div class="cont-busqueda">
                <input type="text" id="buscar_evento" class="input-busqueda" placeholder="Buscar evento...">
                <svg class="icono-filtro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
            </div>

            <p id="aviso_eventos" class="aviso aviso-cargando">Cargando eventos...</p>

            
            <div id="lista_eventos" class="lista"></div>

        </section>

    </main>

    <button type="button" class="fab" id="btn_nuevo_evento" aria-label="Nuevo evento">+</button>

    
    <dialog id="modal_evento" class="modal_rm">

        <form id="forma_evento">

            <h2 class="letra-azul-dark" id="titulo_modal_evento">Nuevo evento</h2>

            
            <input type="hidden" id="id_evento">

            <label for="experiencia_evento">Nombre de la experiencia</label>
            <input type="text" id="experiencia_evento" maxlength="14" required
                   title="Máximo 14 caracteres, que es lo que guarda la base">

            <label for="descripcion_evento">Descripción</label>
            <textarea id="descripcion_evento" maxlength="400"></textarea>

            <label for="fecha_evento">Fecha</label>
            <input type="date" id="fecha_evento" required>

            <label for="franja_evento">Franja horaria</label>
            <input type="text" id="franja_evento" maxlength="6" placeholder="12:00" required
                   title="Máximo 6 caracteres">

            <label for="personas_evento">Número de personas</label>
            <input type="number" id="personas_evento" min="1" max="200" value="20" required>

            <label for="costo_evento">Costo por persona</label>
            <input type="number" id="costo_evento" min="0" step="1000" value="12000" required>

            <p id="aviso_modal_evento" class="aviso oculto"></p>

            <div class="fila_botones_modal">
                <button type="button" id="btn_cerrar_evento" class="btn-capsula capsula-full fondo-gris letra-gris-dark">Cancelar</button>
                <button type="submit" id="btn_guardar_evento" class="btn-capsula capsula-full fondo-verde letra-blanca">Guardar</button>
            </div>

        </form>

    </dialog>

</body>
</html>
