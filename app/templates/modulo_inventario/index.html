<!DOCTYPE html>
<html lang="es">

<head>
    {% include "comun/raiz.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar sesión | REMY 1.0</title>

    <script src="{{ url_for('static', filename='modulo_inventario/js/funciones_rm_interno.js') }}"></script>
 
    <link rel="stylesheet" href="{{ url_for('static', filename='modulo_inventario/css/normalize.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='modulo_inventario/css/Formato_Rm_interno.css') }}?v=9">
</head>


<body id="cuerpo_login">

    <header id="cabezote">
        <div id="cont_marcas">
            <figure id="marca_sena">
                <img src="{{ url_for('static', filename='modulo_inventario/componentes/simbolo_sena_verde.svg') }}" alt="sena cab">
            </figure>
            <div id="linea_vert"></div>
            <figure id="marca_remy">
                <img src="{{ url_for('static', filename='modulo_inventario/componentes/remy_green.svg') }}" alt="remy cab">
            </figure>
        </div>

    </header>

    <main id="cuerpo">
        <form action="{{ url_for('inventario.api.auth_bp.login') }}" method="post" enctype="application/x-www-form-urlencoded"
            id="forma_entrar">
            <h2 class="letra-azul-dark">iniciar session</h2>
            <div class="cont-campo">
                <figure class="iconos">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="currentColor">
                        <path
                            d="M112 128C85.5 128 64 149.5 64 176C64 191.1 71.1 205.3 83.2 214.4L291.2 370.4C308.3 383.2 331.7 383.2 348.8 370.4L556.8 214.4C568.9 205.3 576 191.1 576 176C576 149.5 554.5 128 528 128L112 128zM64 260L64 448C64 483.3 92.7 512 128 512L512 512C547.3 512 576 483.3 576 448L576 260L377.6 408.8C343.5 434.4 296.5 434.4 262.4 408.8L64 260z" />
                    </svg>
                </figure>

                <input type="email" name="usuario" id="usuario" inputmode="email" maxlength="72" minlength="2"
                    placeholder="usuario@soy.sena.edu.co" pattern="^[a-z0-9\.\_\-]+@[a-z0-9\-]+\.[a-z]{2,}$"
                    title="esto no parece un correo electronico institucional, por favor ingrese un correo valido"
                    class="campo" tabindex="1" required>
            </div>

            <div class="cont-campo" id="cont_palabra">
                <figure class="iconos">
                    <?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"
                        fill="currentColor"id="ico_llave">
                        <path
                            d="M400 416C497.2 416 576 337.2 576 240C576 142.8 497.2 64 400 64C302.8 64 224 142.8 224 240C224 258.7 226.9 276.8 232.3 293.7L71 455C66.5 459.5 64 465.6 64 472L64 552C64 565.3 74.7 576 88 576L168 576C181.3 576 192 565.3 192 552L192 512L232 512C245.3 512 256 501.3 256 488L256 448L296 448C302.4 448 308.5 445.5 313 441L346.3 407.7C363.2 413.1 381.3 416 400 416zM440 160C462.1 160 480 177.9 480 200C480 222.1 462.1 240 440 240C417.9 240 400 222.1 400 200C400 177.9 417.9 160 440 160z" />
                    </svg>
                </figure>

                <input type="password" inputmode="tel" name="palabra" id="palabra" placeholder="contraseña"
                    maxlength="10" minlength="10" pattern="[0-9]{10}"
                    title="la contraseña debe contener 10 digitos numericos" class="campo" required tabindex="2">

            </div>

            <button type="submit" id="btn_entrar" tabindex="3"
                class="capsula-full btn-capsula fondo-verde letra-blanca">ENTRAR</button>
        </form>

    </main>
    <footer id="pie">
        <h1>www.sena.edu.co</h1>
        <h3>centro agropecuario de buga</h3>
        <p>@ 2026 - version 1.0</p>
    </footer>

</body>

</html>
