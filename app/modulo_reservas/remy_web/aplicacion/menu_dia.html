<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del día | REMY 1.0</title>
    <link rel="stylesheet" href="../rm_codigos/normalize.css">
    <link rel="stylesheet" href="../rm_codigos/formato_rm_clientes.css">
    <link rel="stylesheet" href="../rm_codigos/formato_menu.css">
    <script src="../rm_codigos/config.js" defer></script>
    <script src="../rm_codigos/api.js" defer></script>
    <script src="../rm_codigos/plantillas.js" defer></script>
    <script src="../rm_codigos/menu_dia.js" defer></script>
</head>
<body id="cuerpo_menu">

    
    <header id="cabezote_titulo" class="fondo-azul" data-titulo="Menú del día"></header>

    <main id="cuerpo">

        <p id="aviso_menu" class="aviso aviso-cargando">Cargando el menú de hoy...</p>

        <div id="sin_menu" class="oculto">
            <figure id="ico_sin_menu">
                <svg viewBox="0 0 512 512" aria-hidden="true">
                    <path fill="currentColor" d="M464,344.063c0-109.308-84.755-199.193-192-207.39V80H240v56.673c-107.245,8.2-192,98.082-192,207.39V377.17H464Zm-32,1.107H80v-1.107c0-97.046,78.953-176,176-176s176,78.953,176,176Z"/>
                    <rect width="480" height="32" x="16" y="416" fill="currentColor"/>
                </svg>
            </figure>
            <h2 class="letra-azul-dark">Sin menú por hoy</h2>
            <p>Lo sentimos, en este momento no hay menús programados para hoy. Vuelve más tarde o consulta con el instructor.</p>
        </div>

        <section id="tarjeta_menu" class="oculto">

            <div id="cont_jornada">
                <div class="cont-dato">
                    <figure class="iconos">
                        <img src="../rm_componentes/lote_iconos/ico_calendario.svg" alt="">
                    </figure>
                    <h3 class="letra-azul-dark">Disponible hoy</h3>
                </div>
                <div class="cont-dato">
                    <figure class="iconos">
                        <img src="../rm_componentes/lote_iconos/ico_eventos.svg" alt="">
                    </figure>
                    <p id="franja_menu">12:00 - 1:00 pm</p>
                </div>
            </div>

            <figure id="foto_principal">
                <img id="img_plato_fuerte" src="../img/principal.jpg" alt="Plato fuerte del día">
            </figure>

            <div id="cont_galeria">
                <figure class="foto-mini">
                    <img id="img_bebida" src="../img/bebidas.jpg" alt="Bebida">
                </figure>
                <figure class="foto-mini">
                    <img id="img_entrada" src="../img/entrada.jpg" alt="Entrada">
                </figure>
                <figure class="foto-mini">
                    <img id="img_postre" src="../img/postre.jpg" alt="Postre">
                </figure>
            </div>

            <div id="cont_detalle">
                <h2 id="titulo_menu" class="letra-azul-dark"></h2>
                <p id="txt_descripcion"></p>

                <form id="forma_reserva">

                    <div id="cont_pedido">
                        <div id="cont_cantidad">
                            <h3>Plato(s)</h3>
                            <div id="cont_controles">
                                <button type="button" id="btn_menos" class="btn-circulo-mini fondo-azul letra-blanca" aria-label="Quitar un plato">-</button>
                                <span id="num_platos" class="fondo-gris-dark letra-blanca">1</span>
                                <button type="button" id="btn_mas" class="btn-circulo-mini fondo-azul letra-blanca" aria-label="Agregar un plato">+</button>
                            </div>
                            <p>Máximo: <span class="letra-azul-dark">10</span> por persona</p>
                        </div>
                        <h2 id="valor_menu" class="letra-azul-dark">$0</h2>
                    </div>

                    <div id="cont_correo">
                        <div class="cont-dato">
                            <figure class="iconos">
                                <img src="../rm_componentes/lote_iconos/ico_persona.svg" alt="">
                            </figure>
                            <h3>Correo institucional</h3>
                        </div>
                        <input type="email" id="correo" name="correo" inputmode="email" maxlength="72" minlength="2"
                               placeholder="ejemplo@soy.sena.edu.co"
                               pattern="[a-zA-Z0-9._%+\-]+@(soy\.)?sena\.edu\.co"
                               title="Usa tu correo institucional @sena.edu.co o @soy.sena.edu.co"
                               class="campo" tabindex="1" required>
                    </div>

                    <p id="aviso_reserva" class="aviso oculto"></p>

                    <button type="submit" id="btn_reservar" class="btn-capsula capsula-full fondo-verde letra-blanca" tabindex="2">Reservar menú</button>

                </form>
            </div>

        </section>

    </main>

    <nav id="tabs_inferior" data-activo="menu_dia"></nav>

</body>
</html>
